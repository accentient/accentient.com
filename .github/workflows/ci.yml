name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Prevent overlapping deploys of the same ref from racing each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Worker Tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  deploy:
    name: Deploy to Cloudflare
    needs: test
    # Only deploy on a push to main (or a manual run), never on pull requests.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm (optional)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies (if needed)
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Generate search index (Pagefind)
        run: npx -y pagefind@latest --site public

      # Cloudflare Pages rejects any single file over 25 MiB. Catch it here with a
      # clear message instead of a cryptic wrangler error mid-upload.
      - name: Check for oversized files (Cloudflare 25 MiB limit)
        run: |
          big=$(find public -type f -size +26214400c -printf '%p\t%s\n')
          if [ -n "$big" ]; then
            echo "$big" | awk -F'\t' '{ printf "::error::%s is %.1f MiB, over Cloudflare Pages 25 MiB per-file limit\n", $1, $2/1048576 }'
            echo "Deploy aborted. Remove the file(s) above, or host them externally (R2, Stream, YouTube)."
            exit 1
          fi
          echo "All files are within the 25 MiB limit."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=accentient-com --branch=main

  deploy-worker:
    name: Deploy Worker to Cloudflare
    needs: test
    # Only deploy on a push to main (or a manual run), never on pull requests.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker (wrangler)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
