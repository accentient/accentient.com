baseURL = "/"
title = " Accentient"

[pagination]
  pagerSize = 9

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

# Nest the blog-only taxonomies under /blog/ (default Hugo puts them at the root).
[permalinks]
  [permalinks.term]
    tags = "/blog/tags/:slug/"
    authors = "/blog/authors/:slug/"
  [permalinks.taxonomy]
    tags = "/blog/tags/"
    authors = "/blog/authors/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Imported posts contain dead inline <script> blocks (old dasBlog chat UI) that
# Hugo's JS minifier can't parse. Skip JS minification so `hugo --minify` never
# chokes on legacy markup; our real JS is served as static files anyway.
[minify]
  disableJS = true

[params]
openGraph = true
Description = "Experts in AI, GitHub, Azure DevOps, Scrum and everything in between"

[params.font]
name = "Inter"
sizes = [400, 500, 600, 700, 800]

[params.hero]
enabled = true
title = "Experts in AI, GitHub, Azure DevOps, Scrum and everything in between"
subtitle = "We help teams deliver high-quality products quickly and efficiently"

# Enable footer
[params.footer]
enabled = true
logo = "/images/logo-150.png"
content = "© 2026 Accentient, Inc. All rights reserved."

# Add navbar links

[params.navbarlogo]
image = "/images/logo-150.png"
link = "/"
width = 150
height = 70

[[params.navbar]]
