{{/* Dropdown to filter the blog by author. Expects a Page as context.
     Preselects the current author when rendered on an author term page. */}}
{{ $current := "" }}
{{ if eq .Kind "term" }}{{ $current = .RelPermalink }}{{ end }}
{{ with .Site.Taxonomies.authors }}
<div class="blog-filter">
  <label class="blog-filter-label" for="author-filter">Filter by author:</label>
  <div class="select">
    <select id="author-filter" aria-label="Filter posts by author" onchange="if(this.value){window.location.href=this.value;}">
      <option value="{{ "/blog/" | relLangURL }}">All authors</option>
      {{ range .Alphabetical }}
      <option value="{{ .Page.RelPermalink }}"{{ if eq .Page.RelPermalink $current }} selected{{ end }}>{{ .Page.Title }} ({{ .Count }})</option>
      {{ end }}
    </select>
  </div>
</div>
{{ end }}
