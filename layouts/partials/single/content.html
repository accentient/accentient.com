<section class="section is-medium pb-0 page-section">
  <div class="container">
    <div class="page-header">
      <h1 class="title section-title">{{ .Title }}</h1>
      {{ with .Params.Subtitle }}<h5 class="subtitle is-5 is-muted">{{ . }}</h5>{{ end }}
      <div class="divider"></div>
    </div>
    <div class="content">
      {{ .Content }}
    </div>
  </div>
</section>
