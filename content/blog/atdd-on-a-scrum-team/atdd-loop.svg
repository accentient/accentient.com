<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#0d1b2a">The ATDD Loop</text>
  <text x="40" y="86" font-size="17" fill="#5b6b7c">Acceptance criteria become the Sprint's tests in Azure Test Plans</text>

  <!-- nodes -->
  <g>
    <!-- 1 -->
    <rect x="60" y="150" width="200" height="92" rx="12" fill="#e8f0fb" stroke="#3f73c4" stroke-width="2"/>
    <text x="160" y="188" font-size="16" font-weight="700" fill="#1f3a5f" text-anchor="middle">1. Specify</text>
    <text x="160" y="212" font-size="13" fill="#34516f" text-anchor="middle">PBI acceptance criteria</text>
    <text x="160" y="230" font-size="13" fill="#34516f" text-anchor="middle">as given-when-then</text>

    <!-- 2 -->
    <rect x="350" y="150" width="200" height="92" rx="12" fill="#e8f0fb" stroke="#3f73c4" stroke-width="2"/>
    <text x="450" y="188" font-size="16" font-weight="700" fill="#1f3a5f" text-anchor="middle">2. Turn into tests</text>
    <text x="450" y="212" font-size="13" fill="#34516f" text-anchor="middle">Paste criteria into a</text>
    <text x="450" y="230" font-size="13" fill="#34516f" text-anchor="middle">test plan as Test Cases</text>

    <!-- 3 -->
    <rect x="640" y="150" width="200" height="92" rx="12" fill="#e8f0fb" stroke="#3f73c4" stroke-width="2"/>
    <text x="740" y="188" font-size="16" font-weight="700" fill="#1f3a5f" text-anchor="middle">3. Develop</text>
    <text x="740" y="212" font-size="13" fill="#34516f" text-anchor="middle">Build to make each</text>
    <text x="740" y="230" font-size="13" fill="#34516f" text-anchor="middle">test pass</text>

    <!-- 4 -->
    <rect x="640" y="320" width="200" height="92" rx="12" fill="#e9f5ee" stroke="#3f9d6b" stroke-width="2"/>
    <text x="740" y="358" font-size="16" font-weight="700" fill="#1e6b41" text-anchor="middle">4. Verify</text>
    <text x="740" y="382" font-size="13" fill="#2f6b48" text-anchor="middle">Run tests; pass = the</text>
    <text x="740" y="400" font-size="13" fill="#2f6b48" text-anchor="middle">PBI meets its criteria</text>

    <!-- center: Done -->
    <rect x="350" y="320" width="200" height="92" rx="12" fill="#0d1b2a"/>
    <text x="450" y="362" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Shared "Done"</text>
    <text x="450" y="388" font-size="13" fill="#b9c4d0" text-anchor="middle">Everyone agrees up front</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0d1b2a"/></marker>
  </defs>
  <line x1="260" y1="196" x2="346" y2="196" stroke="#0d1b2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="550" y1="196" x2="636" y2="196" stroke="#0d1b2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="740" y1="242" x2="740" y2="316" stroke="#0d1b2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="640" y1="366" x2="554" y2="366" stroke="#0d1b2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- feedback loop back to specify -->
  <path d="M 350 366 C 160 366 160 366 160 246" fill="none" stroke="#3f9d6b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="150" y="300" font-size="12.5" fill="#1e6b41" transform="rotate(-90 150 300)">refine criteria at the Retrospective</text>

  <text x="40" y="458" font-size="13" fill="#9aa7b4">Source: Professional Scrum Development with Azure DevOps, Ch. 7</text>
</svg>
