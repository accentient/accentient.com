<svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="40" y="56" font-size="30" font-weight="700" fill="#0d1b2a">Committed vs. Forecasted</text>
  <text x="40" y="88" font-size="17" fill="#5b6b7c">Why the word the tool uses still matters</text>

  <!-- Left card: Committed -->
  <rect x="40" y="120" width="370" height="280" rx="14" fill="#fdecec" stroke="#e07a7a" stroke-width="2"/>
  <text x="64" y="162" font-size="22" font-weight="700" fill="#a02929">"Committed"</text>
  <text x="64" y="188" font-size="14" fill="#7a3b3b">Pre-2011 language, still in Azure Boards</text>
  <line x1="64" y1="206" x2="386" y2="206" stroke="#e6b3b3" stroke-width="1.5"/>
  <text x="64" y="238" font-size="15" fill="#5b3030">A promise to deliver the selected items</text>
  <text x="64" y="266" font-size="15" fill="#5b3030">Treats complex work as predictable</text>
  <text x="64" y="294" font-size="15" fill="#5b3030">Failure to finish reads as broken word</text>
  <text x="64" y="322" font-size="15" fill="#5b3030">Pressure to pad or sandbag the Sprint</text>
  <text x="64" y="360" font-size="14" font-style="italic" fill="#a02929">Drives fear, not transparency</text>

  <!-- Right card: Forecasted -->
  <rect x="470" y="120" width="370" height="280" rx="14" fill="#e9f5ee" stroke="#3f9d6b" stroke-width="2"/>
  <text x="494" y="162" font-size="22" font-weight="700" fill="#1e6b41">"Forecasted"</text>
  <text x="494" y="188" font-size="14" fill="#2f6b48">2020 Scrum Guide language</text>
  <line x1="494" y1="206" x2="816" y2="206" stroke="#b6dcc5" stroke-width="1.5"/>
  <text x="494" y="238" font-size="15" fill="#244e36">A best guess given what's known today</text>
  <text x="494" y="266" font-size="15" fill="#244e36">Reflects the reality of complex work</text>
  <text x="494" y="294" font-size="15" fill="#244e36">Missing items is information, not failure</text>
  <text x="494" y="322" font-size="15" fill="#244e36">Invites honest inspection and adaptation</text>
  <text x="494" y="360" font-size="14" font-style="italic" fill="#1e6b41">Drives transparency, not theater</text>

  <!-- Arrow -->
  <polygon points="418,250 462,250 462,238 452,258 462,278 462,266 418,266" fill="#0d1b2a"/>

  <text x="40" y="438" font-size="13" fill="#9aa7b4">Source: Professional Scrum Development with Azure DevOps, Ch. 3</text>
</svg>
